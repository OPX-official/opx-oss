name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The APK is deliberately tiny. The runtime bootstrap and payloads are downloaded on
      # first launch by RuntimeDownloadManager, which picks arm/aarch64, resumes partial files
      # and verifies every SHA-256 before OpxRuntime installs it. Do not stage assets here:
      # bundling them again would undo the small download and the in-app ABI choice.
      - name: Confirm the APK carries no runtime payloads
        run: |
          set -euo pipefail
          if [ -d app/src/main/assets/bootstrap ] || [ -d app/src/main/assets/payload ]; then
            echo "ERROR: runtime payloads are staged in assets; the APK must download them" >&2
            exit 1
          fi
          echo "Small APK: runtime will be downloaded on first launch"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/OPX-OSS-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/OPX-OSS-release.apk
          ls -lh out

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: opx-oss-apk
          path: out/*.apk
          if-no-files-found: error

      # Artifacts expire and live behind the run page, so every dispatched or tagged build also
      # becomes a Release: the APK is then downloadable straight from the Releases section.
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v0.3.0-alpha.1-build${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$tag" out/*.apk \
            --target "$GITHUB_SHA" \
            --title "OPX OSS ${tag}" \
            --notes "Automated build of commit ${GITHUB_SHA:0:7} (${GITHUB_REF_NAME}), run #${GITHUB_RUN_NUMBER}.

          Debug and release APKs, signed with the repository keystore so a new build installs
          over the previous one. ABIs: arm64-v8a, x86_64 (the embedded CPython runtime has no
          32-bit ARM build)."
