name: Packages

# Builds the OPX package archive (OPX-official/opx-packages) from source. It runs next to
# the APK workflow: nothing here depends on the APK, and the APK build consumes only what
# this workflow publishes. Trigger it manually or whenever the packaging inputs change.
#
# If PACKAGES_TOKEN is not set, the publish step is skipped but the package archive
# is still built locally (in out/) for the APK workflow to use as a fallback.
#
# `scope` decides how much is rebuilt:
#   auto    (default) look at the files that changed; an engine/shim-only change takes the
#           four-minute extras lane, anything else (base runtime, bootstrap, build scripts,
#           an unknown file) rebuilds everything, so a base change can never be skipped
#   all     base runtime + OPX packages (about two hours)
#   extras  only the OPX packages, merged on top of the published archive (about four minutes)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "auto = decide from the changed files, all = base runtime + OPX packages (2h), extras = only the OPX packages (fast lane, ~4 min)"
        type: choice
        options:
          - auto
          - all
          - extras
        default: auto
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/packages.yml'

permissions:
  contents: read
  # The auto scope asks for the commit of the last successful Packages run.
  actions: read

concurrency:
  group: packages
  cancel-in-progress: false

env:
  WIFI4_REPO: https://github.com/OPX-official/opx-wifi4.git
  # Pinned: the engine is built from this exact commit, never from a moving branch.
  WIFI4_COMMIT: 0654049fba6d53ea5fd5cddd541cbc4f860125e7
  # Pinned termux-packages tree: the base runtime is built from this exact commit, so a
  # bootstrap run cannot change under us between attempts. Bump deliberately, with a test run.
  TERMUX_PACKAGES_COMMIT: e735b3bcf2746f12d1b0a4db8d1c4146a4591384
  PACKAGES_REPO: OPX-official/opx-packages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OPX OSS
        uses: actions/checkout@v4

      - name: Checkout wifi4 source (pinned)
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$WIFI4_REPO" references/opx-wifi4
          git -C references/opx-wifi4 checkout "$WIFI4_COMMIT"
          git -C references/opx-wifi4 log -1 --format='wifi4 %h %s'

      - name: Resolve scope
        # Turns `auto` into `all` or `extras` by looking at what changed. Only the engine and
        # the USB shim live in the extras packages, so only they can take the fast lane;
        # every other file — the base runtime, the bootstrap, a build script, this workflow,
        # or something nobody classified yet — falls back to a full rebuild.
        id: scope
        env:
          SCOPE_INPUT: ${{ inputs.scope || 'auto' }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$SCOPE_INPUT" != "auto" ]; then
            echo "scope=$SCOPE_INPUT (chosen by hand)"
            echo "scope=$SCOPE_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A push run knows exactly which commits it covers. A manual run has no diff of its
          # own, so it compares with the commit of the last Packages run that succeeded.
          base=""
          if [ "$EVENT_NAME" = "push" ] && [ -n "${BEFORE_SHA:-}" ] \
             && [ "${BEFORE_SHA//0/}" != "" ]; then
            base="$BEFORE_SHA"
          fi
          if [ -z "$base" ]; then
            base="$(gh run list -R "${REPO:-}" --workflow packages.yml \
              --status success --limit 1 --json headSha -q '.[0].headSha' 2>/dev/null || true)"
          fi

          changed=""
          if [ -n "$base" ]; then
            git fetch --quiet --depth 1 origin "$base" 2>/dev/null || true
            if git cat-file -e "${base}^{commit}" 2>/dev/null; then
              changed="$(git diff --name-only "$base" HEAD || true)"
              echo "comparing $base..HEAD"
            else
              echo "cannot read $base, so the changed files are unknown"
            fi
          else
            echo "no earlier run to compare with, so the changed files are unknown"
          fi

          if [ -z "$changed" ]; then
            echo "nothing to classify, so the whole archive is rebuilt (scope=all)"
            echo "scope=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "--- changed files ---"
          echo "$changed"
          only_extras=1
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              tools/engine/*|tools/usb/*|tools/patch-wifi4.py) ;;
              *) only_extras=0; echo "rebuilds the base too: $file" ;;
            esac
          done <<< "$changed"
          if [ "$only_extras" = "1" ]; then scope=extras; else scope=all; fi
          echo "scope=$scope (auto)"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build packages
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
          OUT: ${{ github.workspace }}/out
          WIFI4_SRC: ${{ github.workspace }}/references/opx-wifi4
        run: |
          set -euo pipefail
          chmod +x tools/build-packages.sh tools/fetch-packages.sh
          docker --version
          tools/build-packages.sh
          echo "--- index summary ---"
          python3 - <<'PY'
          import json, collections
          index = json.load(open("out/index.json", encoding="utf-8"))
          kinds = collections.Counter(e["kind"] for e in index["packages"])
          print("artifacts:", dict(kinds))
          print("total MiB:", round(sum(e["size"] for e in index["packages"]) / 1048576, 1))
          PY

      - name: Publish to the package archive
        # A git branch rejects any file over 100 MiB, and the bootstrap zips and bare base
        # payloads are larger than that. Those go to the `packages` release (2 GiB per asset);
        # everything else, including the apt dists/ tree, stays on gh-pages.
        # If PACKAGES_TOKEN is not set, skip the publish step but continue so
        # the locally-built packages in out/ are available for the APK workflow.
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          set -euo pipefail
          if [ -z "${PACKAGES_TOKEN:-}" ]; then
            echo "PACKAGES_TOKEN not set; skipping archive publish, keeping out/ for APK fallback" >&2
            exit 0
          fi
          export GH_TOKEN="$PACKAGES_TOKEN"

          big="$(mktemp)"
          find out -type f -size +90M -printf '%P\n' | sort > "$big"
          echo "--- oversized artifacts (release assets) ---"
          cat "$big"

          notes="$(mktemp)"
          {
            echo "# OPX package archive"
            echo
            echo "Built from [OPX OSS](https://github.com/OPX-official/opx-oss) by its \`Packages\` workflow."
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Artifacts too large for a git branch live here; \`index.json\` on \`gh-pages\`"
            echo "points at them. Asset names are the archive paths with \`/\` written as \`__\`."
          } > "$notes"
          if gh release view packages -R "$PACKAGES_REPO" >/dev/null 2>&1; then
            gh release edit packages -R "$PACKAGES_REPO" --notes-file "$notes"
          else
            gh release create packages -R "$PACKAGES_REPO" \
              --title "OPX package archive" --notes-file "$notes"
          fi

          # The page is cloned before anything is uploaded: in `extras` scope the catalogue and
          # the base artifacts this run does not rebuild are already on it, and the merge below
          # keeps them.
          remote="https://x-access-token:${PACKAGES_TOKEN}@github.com/${PACKAGES_REPO}.git"
          work="$(mktemp -d)"
          published=""
          if git clone --depth 1 --branch gh-pages "$remote" "$work/page" 2>/dev/null; then
            echo "publishing over the existing gh-pages branch"
            published="$work/page/index.json"
          else
            mkdir -p "$work/page"
            git -C "$work/page" init --quiet
            git -C "$work/page" checkout --quiet -b gh-pages
            git -C "$work/page" remote add origin "$remote"
          fi

          # `extras` (an engine or shim fix) publishes on top of the archive; `all` replaces the
          # catalogue. Either way index.json is complete afterwards, so the APK build never has
          # to know which kind of run wrote it.
          if [ -n "$published" ]; then
            python3 tools/merge-index.py --out out --published "$published" --scope "${SCOPE:-all}"
          else
            python3 tools/merge-index.py --out out --scope "${SCOPE:-all}"
          fi

          stage="$(mktemp -d)"
          while IFS= read -r relative; do
            [ -z "$relative" ] && continue
            cp "out/$relative" "$stage/$(printf '%s' "$relative" | sed 's|/|__|g')"
          done < "$big"
          if compgen -G "$stage/*" > /dev/null; then
            gh release upload packages "$stage"/* -R "$PACKAGES_REPO" --clobber
          fi
          # Prune the release against the merged catalogue, not against this run: an `extras`
          # build rebuilt no base payload, and the bootstrap and base tarballs it did not touch
          # must stay where they are.
          keep="$(mktemp)"
          python3 - "$keep" <<'PY'
          import json, sys
          index = json.load(open("out/index.json", encoding="utf-8"))
          with open(sys.argv[1], "w") as handle:
              for entry in index["packages"]:
                  if entry.get("storage") == "release":
                      handle.write(entry["path"].replace("/", "__") + "\n")
          PY
          gh release view packages -R "$PACKAGES_REPO" --json assets \
            -q '.assets[].name' | while IFS= read -r asset; do
              [ -z "$asset" ] && continue
              grep -qxF "$asset" "$keep" \
                || gh release delete-asset packages "$asset" -R "$PACKAGES_REPO" --yes || true
            done

          # No --delete: a file this run did not build is one the catalogue still lists. The
          # prune below removes only what the merged catalogue dropped (an old version).
          rsync -a --exclude .git out/ "$work/page/"
          # The oversized files are release assets; a branch push would be rejected.
          while IFS= read -r relative; do
            [ -z "$relative" ] && continue
            rm -f "$work/page/$relative"
          done < "$big"
          python3 tools/merge-index.py --out out --prune-page "$work/page"
          {
            echo "# OPX package archive"
            echo
            echo "Built from [OPX OSS](https://github.com/OPX-official/opx-oss) by its \`Packages\` workflow."
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "| kind | files |"
            echo "|---|---|"
            python3 -c "import collections, json; index = json.load(open('out/index.json', encoding='utf-8')); print(''.join(f'| {k} | {c} |\n' for k, c in sorted(collections.Counter(e['kind'] for e in index['packages']).items())), end='')"
            echo
            echo "`index.json` lists every artifact with its SHA-256; the APK build downloads only from here."
          } > "$work/page/README.md"
          git -C "$work/page" add -A
          git -C "$work/page" -c user.name="OPX Packages" -c user.email="opx@opx.dev" \
            commit --quiet -m "packages: $(date -u +%Y.%m.%d-%H%M)"
          git -C "$work/page" push --quiet origin gh-pages
          echo "published $(git -C "$work/page" rev-parse --short HEAD) to gh-pages"

      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "### OPX packages"
            echo
            echo "Scope: \`${{ steps.scope.outputs.scope }}\` (requested: \`${{ inputs.scope || 'auto' }}\`)"
            echo
            du -sh out/* 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"