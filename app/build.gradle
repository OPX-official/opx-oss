plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.opx.oss'
    compileSdk 36

    defaultConfig {
        applicationId "com.opx.oss"
        // Android 6.0 and up, 32- and 64-bit ABIs alike.
        minSdk 24  // Chaquopy 17 (embedded CPython) requires API 24+
        // Kept at 28 so the shared-storage export folder stays an ordinary runtime permission;
        // the engine itself runs in this process and never executes a file.
        targetSdk 28
        // Android only installs a build over an existing app whose versionCode is higher, so CI
        // derives it from the workflow run number. A hand-edited constant meant two builds of
        // the same version could not replace each other.
        versionCode = System.getenv("GITHUB_RUN_NUMBER") != null
                ? 1000 + System.getenv("GITHUB_RUN_NUMBER").toInteger()
                : 22
        versionName "0.3.0-alpha.1"
        vectorDrawables.useSupportLibrary = true

        // The Python runtime and libusb are native. Chaquopy 17 (Python 3.12) has no 32-bit ARM
        // build, so the shipped ABIs are 64-bit ARM plus the emulator.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    // One key for every artifact this repository builds. Android treats a different signature as
    // a different app and refuses to update over it, and AGP's debug signing config generates a
    // fresh key on every CI runner - which is exactly why each new build had to be uninstalled
    // first. The committed key keeps successive builds installable over each other; point the
    // OPX_RELEASE_* variables at a private key to sign releases with your own.
    signingConfigs {
        opx {
            storeFile rootProject.file(System.getenv("OPX_RELEASE_STORE_FILE") ?: "keystore/opx-release.p12")
            storeType System.getenv("OPX_RELEASE_STORE_TYPE") ?: "PKCS12"
            storePassword System.getenv("OPX_RELEASE_STORE_PASSWORD") ?: "opxoss"
            keyAlias System.getenv("OPX_RELEASE_KEY_ALIAS") ?: "opx"
            keyPassword System.getenv("OPX_RELEASE_KEY_PASSWORD") ?: "opxoss"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            signingConfig signingConfigs.opx
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.opx
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
    }

    lint {
        // The target SDK is pinned at 28 on purpose (runtime exec permissions), so the
        // "expired target SDK" check would otherwise fail every release build.
        disable 'ExpiredTargetSdkVersion'
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Stryker's Lottie animations (wifi_scan, usb_stick, settings_gears, router, connection).
    implementation 'com.airbnb.android:lottie:6.7.1'
    // Untars the packaged userland payloads (the archive ships tar.gz trees, not zips).
}

// ---------------------------------------------------------------------------------------------
// Embedded Python: the wifi4 drivers (GPL-2.0-only, vendored under app/src/main/python with its
// LICENSE) run unmodified. They only need PyUSB, which /python/usb_shim.py replaces with a libusb
// wrapper around the usbfs fd that UsbHostBridge already hands over.
//
// Requirements checked before a release build:
//   * app/src/main/jniLibs/<abi>/libusb-1.0.so  (built by scripts/build-libusb.sh)
//   * a host CPython 3.11+ for Chaquopy's codegen: set OPX_BUILD_PYTHON, default /usr/bin/python3
// ---------------------------------------------------------------------------------------------
chaquopy {
    defaultConfig {
        // Chaquopy 17 needs the build interpreter to match the app's Python exactly.
        version "3.12"
        buildPython System.getenv("OPX_BUILD_PYTHON") ?: "/usr/bin/python3"
        // No pip packages: usb_shim.py covers PyUSB's surface for the drivers.
    }
}
