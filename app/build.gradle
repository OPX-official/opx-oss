plugins {
    id 'com.android.application'
}

// The headless engine ships with the APK as well as in the opx-runtime payload: a phone that
// already has a prefix never downloads or unpacks a newer engine, so this is the only way an
// engine fix reaches it. Copying the repository's own file (instead of a checked-in copy) keeps
// the payload and the APK byte-identical.
def engineAssets = file("$buildDir/generated/engineAssets")

tasks.register('syncEngineAsset', Copy) {
    from rootProject.file('tools/engine/opx_engine.py')
    into new File(engineAssets, 'engine')
}

android {
    namespace 'com.opx.oss'
    compileSdk 36

    defaultConfig {
        applicationId "com.opx.oss"
        // Android 6.0 and up, 32- and 64-bit ABIs alike.
        minSdk 23
        // Must stay at 28: Android 10+ refuses to execve() files inside the app home directory for
        // apps targeting 29+, and the whole OPX OSS runtime runs from <files>.
        targetSdk 28
        // Android only installs a build over an existing app whose versionCode is higher, so CI
        // derives it from the workflow run number. A hand-edited constant meant two builds of
        // the same version could not replace each other.
        versionCode = System.getenv("GITHUB_RUN_NUMBER") != null
                ? 1000 + System.getenv("GITHUB_RUN_NUMBER").toInteger()
                : 22
        versionName "0.3.0-alpha.1"
        vectorDrawables.useSupportLibrary = true
    }

    // One key for every artifact this repository builds. Android treats a different signature as
    // a different app and refuses to update over it, and AGP's debug signing config generates a
    // fresh key on every CI runner - which is exactly why each new build had to be uninstalled
    // first. The committed key keeps successive builds installable over each other; point the
    // OPX_RELEASE_* variables at a private key to sign releases with your own.
    signingConfigs {
        opx {
            storeFile rootProject.file(System.getenv("OPX_RELEASE_STORE_FILE") ?: "keystore/opx-release.p12")
            storeType System.getenv("OPX_RELEASE_STORE_TYPE") ?: "PKCS12"
            storePassword System.getenv("OPX_RELEASE_STORE_PASSWORD") ?: "opxoss"
            keyAlias System.getenv("OPX_RELEASE_KEY_ALIAS") ?: "opx"
            keyPassword System.getenv("OPX_RELEASE_KEY_PASSWORD") ?: "opxoss"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            signingConfig signingConfigs.opx
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.opx
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
    }

    sourceSets {
        main {
            assets.srcDirs += engineAssets
        }
    }

    lint {
        // The target SDK is pinned at 28 on purpose (runtime exec permissions), so the
        // "expired target SDK" check would otherwise fail every release build.
        disable 'ExpiredTargetSdkVersion'
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

preBuild.dependsOn syncEngineAsset

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Stryker's Lottie animations (wifi_scan, usb_stick, settings_gears, router, connection).
    implementation 'com.airbnb.android:lottie:6.7.1'
    // Untars the packaged userland payloads (the archive ships tar.gz trees, not zips).
    implementation 'org.apache.commons:commons-compress:1.27.1'
}
