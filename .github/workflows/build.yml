name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Everything the APK ships is built by the Packages workflow and downloaded from the OPX
      # package archive; nothing here talks to another app's repository.
      - name: Fetch runtime from the OPX package archive
        # Try the archive first; if that fails (e.g. PACKAGES_TOKEN missing, archive not published),
        # fall back to the locally-built packages from the Packages workflow's out/ directory.
        run: |
          set -euo pipefail
          ASSETS_DIR="$PWD/app/src/main/assets"
          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT
  
          # Attempt archive fetch
          if bash tools/fetch-packages.sh; then
            echo "Fetched runtime from OPX package archive"
          else
            echo "Archive fetch failed; falling back to local packages from out/"
            if [ -d "out" ] && [ -f "out/index.json" ] && [ -f "out/bootstrap/bootstrap-aarch64.zip" ]; then
              echo "== copying local packages to assets"
              rm -rf "$ASSETS_DIR/bootstrap" "$ASSETS_DIR/payload" "$ASSETS_DIR/index.json"
              cp -r out/bootstrap "$ASSETS_DIR/"
              cp -r out/payload "$ASSETS_DIR/"
              cp out/index.json "$ASSETS_DIR/"
              echo "Local packages staged for APK build"
            else
              echo "ERROR: no local packages found in out/ and archive fetch failed" >&2
              exit 1
            fi
          fi
  
          rm -rf "$WORK_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/OPX-OSS-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/OPX-OSS-release.apk
          ls -lh out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: opx-oss-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
