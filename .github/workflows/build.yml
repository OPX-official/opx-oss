name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The APK is deliberately tiny. The runtime bootstrap and payloads are downloaded on
      # first launch by RuntimeDownloadManager, which picks arm/aarch64, resumes partial files
      # and verifies every SHA-256 before OpxRuntime installs it. Do not stage assets here:
      # bundling them again would undo the small download and the in-app ABI choice.
      - name: Confirm the APK carries no runtime payloads
        run: |
          set -euo pipefail
          if [ -d app/src/main/assets/bootstrap ] || [ -d app/src/main/assets/payload ]; then
            echo "ERROR: runtime payloads are staged in assets; the APK must download them" >&2
            exit 1
          fi
          echo "Small APK: runtime will be downloaded on first launch"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/OPX-OSS-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/OPX-OSS-release.apk
          ls -lh out

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: opx-oss-apk
          path: out/*.apk
          if-no-files-found: error

      # A pushed v* tag gets its own versioned release. Any other build on main (push or manual
      # dispatch) refreshes one rolling pre-release, so the APKs the workflow just built are
      # always in the Releases section without anyone hand-pushing a tag.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: out/*.apk
          generate_release_notes: true
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

      - name: Publish latest build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automatic build of `${{ github.sha }}` from the `${{ github.event_name }}` event on `${{ github.ref_name }}`.
            Workflow run ${{ github.run_number }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            - `OPX-OSS-release.apk` — release build, signed with the OPX key
            - `OPX-OSS-debug.apk` — debug build

            Every successful build replaces both files, so this release always holds the newest APK.
            Direct link: https://github.com/${{ github.repository }}/releases/download/latest/OPX-OSS-release.apk
          prerelease: true
          files: out/*.apk
