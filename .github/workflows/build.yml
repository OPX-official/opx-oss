name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          set +e
          yes | "$SDKMANAGER" --install "ndk;27.0.12077973" > /dev/null
          status="${PIPESTATUS[1]}"
          set -e
          [ "$status" -eq 0 ] || exit "$status"

      - name: Cache packaged runtime
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/bootstrap
            app/src/main/assets/payload
            app/src/main/assets/index.json
          key: opx-runtime-v3-${{ hashFiles('tools/fetch-packages.sh') }}-${{ github.run_number }}
          restore-keys: |
            opx-runtime-

      # Everything the APK ships is built by the Packages workflow and downloaded from the OPX
      # package archive; nothing here talks to another app's repository.
      - name: Fetch runtime from the OPX package archive
        run: bash tools/fetch-packages.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/OPX-OSS-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/OPX-OSS-release.apk
          ls -lh out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: opx-oss-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
