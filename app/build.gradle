plugins {
    id 'com.android.application'
}

android {
    namespace 'com.opx.oss'
    compileSdk 36

    defaultConfig {
        applicationId "com.opx.oss"
        // Android 6.0 and up, 32- and 64-bit ABIs alike.
        minSdk 23
        // Must stay at 28: Android 10+ refuses to execve() files inside the app home directory for
        // apps targeting 29+, and the whole OPX OSS runtime runs from <files>.
        targetSdk 28
        versionCode 22
        versionName "0.3.0-alpha.1"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            // CI signs with the debug key so every workflow run produces an installable APK.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
    }

    lint {
        // The target SDK is pinned at 28 on purpose (runtime exec permissions), so the
        // "expired target SDK" check would otherwise fail every release build.
        disable 'ExpiredTargetSdkVersion'
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Untars the packaged userland payloads (the archive ships tar.gz trees, not zips).
    implementation 'org.apache.commons:commons-compress:1.27.1'
}
